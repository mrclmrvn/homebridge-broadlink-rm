<link rel="stylesheet" href="editor/command-editor.css">
<script src="editor/command-editor.js" defer></script>

<style>
  .broadlink-fields {
    display: grid;
    gap: 1rem;
    grid-template-columns: minmax(0, 1fr);
  }
  .broadlink-group {
    min-width: 0;
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--bs-border-color, currentColor);
  }
  .broadlink-group legend {
    float: none;
    width: auto;
    margin: 0;
    padding-right: 0.75rem;
    font-size: 1rem;
    font-weight: 600;
  }
  #accessory-tabs .nav-link {
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  #accessory-confirmation:not([hidden]) {
    display: flex;
  }
  @media (min-width: 576px) {
    .broadlink-fields {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }
</style>

<div id="accessory-tabs" class="nav nav-tabs mb-3" role="tablist" aria-label="Accessories">
  <button id="add-accessory" class="nav-link" type="button" role="tab">Add new accessory</button>
</div>
<p id="config-status" class="form-text" role="status">Loading configuration…</p>

<form id="accessory-settings" role="tabpanel" hidden>
  <div class="d-flex align-items-start gap-3 mb-3">
    <div class="btn-group" role="tablist" aria-label="Accessory configuration">
      <button id="settings-tab" class="btn btn-outline-primary" type="button" role="tab" aria-controls="settings-panel">Settings</button>
      <button id="data-tab" class="btn btn-outline-primary" type="button" role="tab" aria-controls="data-panel">Command Data</button>
    </div>
    <button id="delete-accessory" class="btn btn-outline-danger" type="button" hidden>Delete</button>
    <button id="cancel-accessory" class="btn btn-outline-secondary" type="button" hidden>Cancel</button>
  </div>
  <div id="accessory-confirmation" class="alert alert-warning align-items-center gap-3" role="alertdialog" aria-modal="true" hidden>
    <span id="accessory-confirmation-message" class="flex-grow-1"></span>
    <button id="confirm-accessory-action" class="btn btn-danger" type="button">Confirm</button>
    <button id="dismiss-accessory-action" class="btn btn-outline-secondary" type="button">Keep</button>
  </div>
  <div id="settings-panel" role="tabpanel" aria-labelledby="settings-tab">
    <div id="accessory-fields" class="broadlink-fields"></div>
    <div class="form-check d-flex align-items-center gap-2 mt-3 ps-0">
      <input id="field-disabled" name="disabled" type="checkbox" class="form-check-input m-0 float-none flex-shrink-0">
      <label for="field-disabled" class="form-check-label">Disable</label>
    </div>
  </div>
  <div id="data-panel" role="tabpanel" aria-labelledby="data-tab" hidden>
    <label for="command-data" class="form-label">IR/RF command data (JSON)</label>
    <div class="form-check mb-2">
      <input id="command-wrap-lines" class="form-check-input" type="checkbox">
      <label class="form-check-label" for="command-wrap-lines">Wrap lines</label>
    </div>
    <div id="command-editor" class="border rounded" style="height: 20rem" hidden></div>
    <textarea id="command-data" name="data" data-kind="json" class="form-control font-monospace"
      rows="10" spellcheck="false" autocomplete="off" aria-describedby="config-status"></textarea>
  </div>
</form>

<script src="plugin-config.js" defer></script>
